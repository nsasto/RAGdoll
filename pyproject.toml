[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-ragdoll"
version = "3.0.0"
description = "An application-embedded SDK for durable ingestion, versioned corpora, and predictable RAG retrieval."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Nathan Sasto"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "langchain==1.0.5",
    "langchain-openai==1.0.2",
    "langchain-huggingface==1.0.1",
    "langchain-community==0.4.1",
    "langchain-chroma==1.0.0",
    "chromadb==1.3.4",
    "langchain-core==1.0.4",
    "langsmith==0.4.42",
    "langchain-google-community==3.0.0",
    "langchain-text-splitters==1.0.0",
    "langchain-markitdown>=1.0.0",
    "openai>=1.40.0",
    "python-dotenv==1.0.1",
    "retry==0.9.2",
    "flask==3.0.0",
    "flask-cors==4.0.0",
    "fastapi==0.115.2",
    "uvicorn==0.30.6",
    "jinja2==3.1.4",
    "python-multipart==0.0.9",
    "rapidfuzz>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.0",
    "pytest-asyncio>=0.23.0",
    "coverage",
    "black",
    "isort",
    "flake8",
    "faiss-cpu>=1.7.0",
]
entity = [
    "spacy>=3.7.0",
    "spacy-transformers",
    "sentence_transformers>=2.2.2",
    "PyMuPDF>=1.25.5",
]
graph = [
    "neo4j>=5.11.0",
    "rdflib",
]
scaled = [
    "celery>=5.4.0",
    "psycopg[binary]>=3.2.0",
    "qdrant-client>=1.12.0",
    "langchain-qdrant>=0.2.0",
]
all = [
    "python-ragdoll[dev,entity,graph,scaled]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ragdoll*", "demo_app*"]

[tool.setuptools.package-data]
ragdoll = ["config/*.yaml", "prompts/*.md"]
demo_app = ["templates/*.html", "templates/partials/*.html"]
