execution:
  adapter: inline
  max_concurrent_jobs: 4

job_store:
  adapter: file
  path: /var/lib/ragdoll/jobs

corpus_index:
  adapter: vector
  state_adapter: file
  state_path: /var/lib/ragdoll/corpora.json

vector_store:
  enabled: true
  store_type: chroma
  params:
    collection_name: application_documents
    persist_directory: /var/lib/ragdoll/chroma

